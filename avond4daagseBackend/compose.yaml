services:
  db:
    image: postgres:16
    container_name: avond4daagse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: avond4daagse
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d avond4daagse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: